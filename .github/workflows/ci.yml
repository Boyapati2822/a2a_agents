name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt httpx pytest ruff==0.17.3

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Tests
        run: make test


